<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">

    <!-- Icono + contenido -->
    <div class="px-6 pt-8 pb-6 text-center">

      <!-- Icono según tipo -->
      <div class="flex items-center justify-center mb-4">
        <div class="w-16 h-16 rounded-full flex items-center justify-center" [class]="icono">

          @if (tipo === 'danger') {
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              <path d="M10 11v6"/><path d="M14 11v6"/>
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
            </svg>
          }

          @if (tipo === 'warning') {
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
              <line x1="12" y1="9" x2="12" y2="13"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
          }

          @if (tipo === 'info') {
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
          }

        </div>
      </div>

      <h3 class="text-xl font-black text-slate-900 mb-2">{{ titulo }}</h3>
      <p class="text-sm text-slate-500 font-medium leading-relaxed">{{ mensaje }}</p>

    </div>

    <!-- Footer botones -->
    <div class="px-6 pb-6 flex gap-3">
      <button
        (click)="cancelar.emit()"
        [disabled]="cargando"
        class="flex-1 py-3 px-4 border border-slate-200 rounded-xl font-bold
               text-slate-700 hover:bg-slate-50 hover:border-slate-300
               transition-all active:scale-95 disabled:opacity-50">
        {{ labelCancelar }}
      </button>

      <button
        (click)="confirmar.emit()"
        [disabled]="cargando"
        class="flex-1 py-3 px-4 rounded-xl font-bold text-white shadow-lg
               transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed"
        [class]="colorConfirmar">

        @if (cargando) {
          <span class="flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
              viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" class="animate-spin">
              <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
            </svg>
            Eliminando...
          </span>
        } @else {
          {{ labelConfirmar }}
        }

      </button>
    </div>

  </div>
</div>
