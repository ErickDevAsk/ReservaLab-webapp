<div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between transition-all hover:shadow-md hover:border-blue-100">
    <div class="space-y-1">
        <p class="text-sm font-medium text-slate-500">{{ title() }}</p>
        <h3 class="text-3xl font-bold text-slate-900 leading-none">{{ value() }}</h3>
    </div>
  
    <div [class]="'p-4 rounded-xl flex items-center justify-center ' + iconBgClass()">
        @switch (icon()) {
            @case ('calendar') {
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [class]="'lucide lucide-calendar w-6 h-6 ' + iconColorClass()">
                <path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path>
            </svg>
            }
            @case ('package') {
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [class]="'lucide lucide-package w-6 h-6 ' + iconColorClass()">
                <path d="m7.5 4.27 9 5.15"></path><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.27 6.96 8.73 5.04 8.73-5.04"></path><path d="M12 22.08V12"></path>
            </svg>
            }
            @case ('clock') {
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [class]="'lucide lucide-clock w-6 h-6 ' + iconColorClass()">
                <circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            }
        }
    </div>
</div>
