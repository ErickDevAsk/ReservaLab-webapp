<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-content">

      <div class="logo-section">
        <svg class="logo-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
        </svg>
        <span class="logo-text">ReservaLab</span>
      </div>

      <div class="desktop-menu">
        <a (click)="scrollTo('beneficios')" class="nav-link">Beneficios</a>
        <a (click)="scrollTo('laboratorios')" class="nav-link">Laboratorios</a>
        <a routerLink="/reglamento" class="nav-link">Reglamento</a>

        @if (!isLoggedIn()) {
          <button routerLink="/login-reserva" class="btn-text">Iniciar Sesión</button>
          <button routerLink="/register" class="btn-primary">Registrarse</button>
        } @else {
          <span class="nav-link" style="font-weight: bold; color: #2563eb;">Hola, {{ username() }}</span>
          <button routerLink="/student-dashboard" class="btn-text">Mi Dashboard</button>
          <button (click)="logout()" class="btn-primary" style="background-color: #ef4444; border-color: #ef4444;">Salir</button>
        }
      </div>

      <div class="mobile-toggle">
        <button (click)="toggleMenu()" class="btn-icon">
          <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            @if (!isMobileMenuOpen()) {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            } @else {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            }
          </svg>
        </button>
      </div>

    </div>
  </div>

  @if (isMobileMenuOpen()) {
    <div class="mobile-menu">
      <div class="mobile-menu-content">
        <a (click)="scrollTo('beneficios')" class="mobile-link">Beneficios</a>
        <a (click)="scrollTo('laboratorios')" class="mobile-link">Laboratorios</a>
        <a routerLink="/reglamento" class="mobile-link">Reglamento</a>

        <hr class="divider">

        @if (!isLoggedIn()) {
          <button routerLink="/login-reserva" class="mobile-btn-text">Iniciar Sesión</button>
          <button routerLink="/register" class="mobile-btn-primary">Registrarse</button>
        } @else {
          <span class="mobile-link" style="font-weight: bold; color: #2563eb;">Hola, {{ username() }}</span>
          <button routerLink="/student-dashboard" class="mobile-btn-text">Mi Dashboard</button>
          <button (click)="logout()" class="mobile-btn-primary" style="background-color: #ef4444; border-color: #ef4444;">Salir</button>
        }
      </div>
    </div>
  }
</nav>
