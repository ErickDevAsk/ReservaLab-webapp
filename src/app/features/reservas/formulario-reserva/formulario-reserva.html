<div class="login-container">
  <div class="login-card">
    <div class="logo">
      <div class="logo-icon">RL</div>
      <h2>ReservaLab</h2>
    </div>

    <h1>Iniciar Sesión</h1>
    <p>¿No tienes una cuenta? <a href="#">Regístrate aquí</a></p>

    <form (submit)="$event.preventDefault()">
      <div class="input-group">
        <label>Correo o Usuario</label>
        <div class="input-with-icon">
          <i class="bi bi-envelope"></i>
          <input type="text" name="username" [(ngModel)]="loginData.username" placeholder="admin@uni.edu">
        </div>
      </div>

      <div class="input-group">
        <label>Contraseña</label>
        <div class="input-with-icon">
          <i class="bi bi-lock"></i>
          <input type="password" name="password" [(ngModel)]="loginData.password" placeholder="Tu contraseña">
        </div>
      </div>

      <div class="options">
        <label><input type="checkbox"> Recordarme</label>
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="button" (click)="onLogin()" class="btn-primary">Iniciar Sesión</button>
    </form>
  </div>
</div>
