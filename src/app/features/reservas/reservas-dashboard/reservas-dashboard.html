<main class="flex-1 p-4 lg:p-6 overflow-auto bg-muted/30">
  <div class="space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div>
        <h1 class="text-3xl font-bold text-foreground">Gestión de Reservas</h1>
        <p class="text-muted-foreground mt-1">Reserva equipos y espacios de laboratorio</p>
      </div>
      <div class="flex items-center gap-2">
        <button class="px-4 py-2 rounded-lg text-sm font-medium transition-colors bg-muted text-foreground hover:bg-muted/70">Semanal</button>
        <button class="px-4 py-2 rounded-lg text-sm font-medium transition-colors bg-primary text-primary-foreground">Diario</button>
      </div>
    </div>
    <!-- Calendario de reservas -->
    <div class="bg-white rounded-lg border border-border p-6">
      <div class="flex items-center justify-between mb-6">
        <button class="px-4 py-2 border border-border rounded-lg hover:bg-muted transition-colors">← Anterior</button>
        <h2 class="text-lg font-semibold text-foreground">{{ mesAnio() }}</h2>
        <button class="px-4 py-2 border border-border rounded-lg hover:bg-muted transition-colors">Siguiente →</button>
      </div>

      <div class="space-y-2">
        <div class="text-center mb-4">
          <p class="text-lg font-semibold text-foreground">{{ fechaVisual() }}</p>
        </div>

        <!-- Mensaje de error si la API falla -->
        @if (errorApi()) {
          <div class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span>{{ errorApi() }}</span>
          </div>
        }
        <!-- Listado de horarios -->
        @for (slot of horarioSlots(); track slot.hora) {
          <button 
            (click)="seleccionarSlot(slot)"
            [ngClass]="slot.disponible ? 'bg-green-50 border-green-200 hover:bg-green-100' : 'bg-red-50 border-red-200 cursor-not-allowed'"
            class="w-full p-4 rounded-lg text-left transition-all flex items-center justify-between border">
            
            <div class="flex items-center gap-3">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-muted-foreground">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <div>
                <p class="font-medium text-foreground">{{ slot.hora }}</p>
                <p class="text-sm" [ngClass]="slot.disponible ? 'text-green-700' : 'text-red-700'">
                  {{ slot.disponible ? 'Disponible' : 'Ocupado' }}
                </p>
              </div>
            </div>
            <!-- Icono de disponibilidad -->
            @if (slot.disponible) {
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary">
                <path d="M5 12h14"></path>
                <path d="M12 5v14"></path>
              </svg>
            }
          </button>
        }
      </div>
    </div>
    
    <div class="bg-white rounded-lg border border-border p-4">
      <div class="flex flex-wrap items-center gap-6">
        <div class="flex items-center gap-2">
          <div class="w-4 h-4 bg-green-100 border border-green-200 rounded"></div>
          <span class="text-sm text-muted-foreground">Disponible</span>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-4 h-4 bg-red-100 border border-red-200 rounded"></div>
          <span class="text-sm text-muted-foreground">Ocupado</span>
        </div>
      </div>
    </div>
  </div>
   <!-- Modal de reserva -->
    @if (mostrarModal()) {
    <app-reserva-modal 
      [horaInicio]="slotSeleccionado()"
      [nombreLab]="'Laboratorio de Redes'" 
      (alCerrar)="cerrarModal()"
      (alConfirmar)="procesarReserva($event)">
    </app-reserva-modal>
    }
</main>
