<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">

    <!-- Header del modal -->
    <div class="flex items-center justify-between px-6 py-5 border-b border-slate-100 shrink-0">
      <h3 class="text-xl font-black text-slate-900">Confirmar Reserva</h3>
      <button
        (click)="cerrar()"
        class="p-2 rounded-xl text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>

    <!-- Cuerpo con scroll -->
    <div class="overflow-y-auto flex-1">
      <div class="px-6 pt-5 space-y-4">

        <!-- Resumen de fecha y hora -->
        <div class="bg-blue-50 border border-blue-100 rounded-xl p-4 space-y-2">
          <div class="flex items-center gap-2 text-blue-700">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>
            </svg>
            <span class="font-bold text-sm capitalize">{{ fechaDisplay() }}</span>
          </div>
          <div class="flex items-center gap-2 text-blue-700">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            <span class="font-bold text-lg">{{ hora() }}</span>
          </div>
        </div>

        <!-- Laboratorio -->
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1.5">
            Laboratorio <span class="text-red-500">*</span>
          </label>
          <select
            [(ngModel)]="laboratorio"
            name="laboratorio"
            class="w-full px-3 py-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-800 font-medium focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all">
            <option value="">Selecciona un laboratorio</option>
            @for (lab of laboratorios; track lab) {
              <option [value]="lab">{{ lab }}</option>
            }
          </select>
        </div>

        <!-- Equipo -->
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1.5">
            Equipo <span class="text-red-500">*</span>
          </label>
          <select
            [(ngModel)]="equipo"
            name="equipo"
            class="w-full px-3 py-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-800 font-medium focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all">
            <option value="">Selecciona un equipo</option>
            @for (eq of equipos; track eq) {
              <option [value]="eq">{{ eq }}</option>
            }
          </select>
        </div>

        <!-- Duración -->
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1.5">Duración</label>
          <select
            [(ngModel)]="duracion"
            name="duracion"
            class="w-full px-3 py-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-800 font-medium focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all">
            <option [ngValue]="1">1 hora</option>
            <option [ngValue]="2">2 horas</option>
            <option [ngValue]="3">3 horas</option>
            <option [ngValue]="4">4 horas</option>
          </select>
        </div>

        <!-- Propósito -->
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1.5">
            Propósito de la Reserva <span class="text-red-500">*</span>
          </label>
          <textarea
            [(ngModel)]="proposito"
            name="proposito"
            rows="3"
            placeholder="Describe el motivo de tu reserva (mínimo 10 caracteres)..."
            class="w-full px-3 py-2.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-800 font-medium resize-none focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all placeholder:text-slate-400">
          </textarea>
          <!-- Contador de caracteres -->
          <p class="text-xs mt-1 text-right font-medium"
             [class.text-red-500]="proposito.length > 0 && proposito.length < 10"
             [class.text-green-600]="proposito.length >= 10"
             [class.text-slate-400]="proposito.length === 0">
            {{ proposito.length }} / mín. 10 caracteres
          </p>
        </div>

        <!-- Normas de Uso -->
        <div class="bg-slate-50 rounded-xl p-4">
          <p class="text-sm font-black text-slate-700 mb-3">Normas de Uso</p>
          <ul class="space-y-2">
            @for (norma of normas; track norma) {
              <li class="flex items-start gap-2 text-sm text-slate-600 font-medium">
                <span class="text-blue-500 mt-0.5 shrink-0">•</span>
                {{ norma }}
              </li>
            }
          </ul>
        </div>

      </div>
    </div>

    <!-- Footer con botones -->
    <div class="px-6 py-5 border-t border-slate-100 flex gap-3 shrink-0">
      <button
        (click)="cerrar()"
        class="flex-1 py-3 px-4 border border-slate-200 rounded-xl font-bold text-slate-700 hover:bg-slate-50 hover:border-slate-300 transition-all active:scale-95">
        Cancelar
      </button>
      <button
        (click)="confirmarReserva()"
        class="flex-1 py-3 px-4 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition-all shadow-lg shadow-blue-200 active:scale-95">
        Confirmar Reserva
      </button>
    </div>
  </div>
</div>
