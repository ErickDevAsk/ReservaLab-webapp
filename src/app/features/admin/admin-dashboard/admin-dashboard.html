    <div class="flex items-center justify-between">
      <h3 class="text-3xl font-bold text-purple-600">{{ laboratoriosRed }}</h3>
      <div class="p-3 bg-purple-50 rounded-lg text-purple-600 flex items-center justify-center w-12 h-12">

  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex flex-col justify-center">
    <p class="text-sm font-medium text-gray-500 mb-2">Reservas de Hoy</p>
    <div class="flex items-center justify-between">
      <h3 class="text-3xl font-bold text-orange-600">{{ reservasHoy }}</h3>
      <div class="p-3 bg-orange-50 rounded-lg text-orange-600 flex items-center justify-center w-12 h-12">

  </div>

</div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 w-full">

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 w-full">
      <h3 class="text-lg font-semibold text-gray-800 mb-4">Tendencia de Reservas (Últimos 7 días)</h3>
      <div class="h-72 w-full">
        <div class="relative w-full h-full">
          <ngx-charts-line-chart
            class="absolute inset-0"
            [scheme]="colorSchemeLinea"
            [results]="datosTendencia"
            [gradient]="true"
            [xAxis]="true"
            [yAxis]="true"
            [legend]="false"
            [showXAxisLabel]="true"
            [showYAxisLabel]="true"
            xAxisLabel="Días"
            yAxisLabel="Cantidad"
            [autoScale]="true">
          </ngx-charts-line-chart>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 w-full">
      <h3 class="text-lg font-semibold text-gray-800 mb-4">Estado General de Reservas</h3>
      <div class="h-72 w-full">
        <div class="relative w-full h-full">
          <ngx-charts-pie-chart
            class="absolute inset-0"
            [scheme]="colorSchemePastel"
            [results]="datosEstado"
            [gradient]="false"
            [legend]="true"
            [legendPosition]="posicionLeyenda"
            [labels]="true"
            [doughnut]="true">
          </ngx-charts-pie-chart>
        </div>
      </div>
    </div>

  </div>

</div> ```
