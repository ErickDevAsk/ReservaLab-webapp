<div class="admin-container">
  <header class="admin-header">
    <h1>Gestión de Personal Técnico</h1>
  </header>

  <div class="gestion-grid">
    <section class="form-section card">
      <h3>➕ Nuevo Técnico</h3>
      <form (ngSubmit)="registrarTecnico()">
        <div class="form-group"><label>Nombre</label><input [(ngModel)]="nuevoTecnico.first_name" name="fn" required></div>
        <div class="form-group"><label>Apellido</label><input [(ngModel)]="nuevoTecnico.last_name" name="ln" required></div>
        <div class="form-group"><label>Matrícula</label><input [(ngModel)]="nuevoTecnico.matricula_id" name="mat" required></div>
        <button type="submit" class="btn-primary">Crear Cuenta</button>
      </form>
    </section>

    <section class="table-section card">
      <h3>👥 Staff Activo</h3>

      <div class="table-responsive">
        <table class="tecnicos-table">
          <thead>
            <tr>
              <th>Matrícula</th>
              <th>Nombre</th>
              <th>Carrera</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let t of tecnicos()">
              <td>{{ t.matricula_id }}</td>
              <td>{{ t.first_name }} {{ t.last_name }}</td>
              <td>{{ t.carrera_departamento }}</td>
              <td><button class="btn-danger">Baja</button></td>
            </tr>

            <tr *ngIf="tecnicos().length === 0 && !cargando()">
              <td colspan="4" style="text-align: center; padding: 20px;">
                No se encontraron técnicos en la base de datos.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</div>
