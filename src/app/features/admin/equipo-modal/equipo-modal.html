<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">

    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-5 border-b border-slate-100 shrink-0">
      <h3 class="text-xl font-black text-slate-900">
        {{ modoEdicion ? 'Editar Equipo' : 'Nuevo Equipo' }}
      </h3>
      <button (click)="onCerrar()"
        class="p-2 rounded-xl text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="overflow-y-auto flex-1 px-6 py-5 space-y-5">

      <!-- Nombre -->
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1.5">
          Nombre <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          [(ngModel)]="form.nombre"
          placeholder="Ej. Microscopio Óptico"
          class="w-full px-3 py-2.5 border border-slate-200 rounded-xl bg-slate-50
                 text-slate-800 font-medium focus:outline-none focus:border-blue-500
                 focus:ring-2 focus:ring-blue-100 transition-all placeholder:text-slate-400"
        />
      </div>

      <!-- N° Inventario -->
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1.5">
          N° Inventario <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          [(ngModel)]="form.numero_inventario"
          placeholder="Ej. MIC-001"
          class="w-full px-3 py-2.5 border border-slate-200 rounded-xl bg-slate-50
                 text-slate-800 font-mono font-medium focus:outline-none focus:border-blue-500
                 focus:ring-2 focus:ring-blue-100 transition-all placeholder:text-slate-400"
        />
      </div>

      <!-- Descripción -->
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1.5">Descripción</label>
        <textarea
          [(ngModel)]="form.descripcion"
          rows="3"
          placeholder="Describe brevemente el equipo..."
          class="w-full px-3 py-2.5 border border-slate-200 rounded-xl bg-slate-50
                 text-slate-800 font-medium resize-none focus:outline-none
                 focus:border-blue-500 focus:ring-2 focus:ring-blue-100
                 transition-all placeholder:text-slate-400">
        </textarea>
      </div>

      <!-- Stock -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1.5">
            Cantidad Total <span class="text-red-500">*</span>
          </label>
          <input
            type="number"
            [(ngModel)]="form.cantidad_total"
            [min]="1"
            class="w-full px-3 py-2.5 border border-slate-200 rounded-xl bg-slate-50
                   text-slate-800 font-medium focus:outline-none focus:border-blue-500
                   focus:ring-2 focus:ring-blue-100 transition-all"
          />
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1.5">
            Cantidad Disponible <span class="text-red-500">*</span>
          </label>
          <input
            type="number"
            [(ngModel)]="form.cantidad_disponible"
            [min]="0"
            [max]="form.cantidad_total"
            class="w-full px-3 py-2.5 border border-slate-200 rounded-xl bg-slate-50
                   text-slate-800 font-medium focus:outline-none focus:border-blue-500
                   focus:ring-2 focus:ring-blue-100 transition-all"
          />
        </div>
      </div>

      <!-- Estado -->
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1.5">Estado</label>
        <select
          [(ngModel)]="form.estado"
          class="w-full px-3 py-2.5 border border-slate-200 rounded-xl bg-slate-50
                 text-slate-800 font-medium focus:outline-none focus:border-blue-500
                 focus:ring-2 focus:ring-blue-100 transition-all">
          @for (estado of estados; track estado) {
            <option [value]="estado">{{ estado }}</option>
          }
        </select>
      </div>

      <!-- Laboratorio -->
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1.5">Laboratorio</label>

        @if (cargandoLabs) {
          <div class="w-full px-3 py-2.5 border border-slate-200 rounded-xl bg-slate-50
                      flex items-center gap-2 text-slate-400 text-sm font-medium">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
              viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" class="animate-spin">
              <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
            </svg>
            Cargando laboratorios...
          </div>
        } @else {
          <select
            [(ngModel)]="form.laboratorio"
            class="w-full px-3 py-2.5 border border-slate-200 rounded-xl bg-slate-50
                   text-slate-800 font-medium focus:outline-none focus:border-blue-500
                   focus:ring-2 focus:ring-blue-100 transition-all">
            <option [value]="null">Sin asignar (General)</option>
            @for (lab of laboratorios; track lab.id) {
              <option [value]="lab.id">{{ lab.nombre }}</option>
            }
          </select>
        }
      </div>

    </div>

    <!-- Footer -->
    <div class="px-6 py-5 border-t border-slate-100 flex gap-3 shrink-0">
      <button (click)="onCerrar()"
        class="flex-1 py-3 px-4 border border-slate-200 rounded-xl font-bold
               text-slate-700 hover:bg-slate-50 hover:border-slate-300
               transition-all active:scale-95">
        Cancelar
      </button>
      <button (click)="guardar()"
        [disabled]="guardando || !form.nombre || !form.numero_inventario"
        class="flex-1 py-3 px-4 rounded-xl font-bold transition-all active:scale-95
               bg-blue-600 text-white hover:bg-blue-700 shadow-lg shadow-blue-200
               disabled:bg-slate-100 disabled:text-slate-400 disabled:cursor-not-allowed
               disabled:shadow-none">
        @if (guardando) {
          <span class="flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
              viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" class="animate-spin">
              <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
            </svg>
            Guardando...
          </span>
        } @else {
          {{ modoEdicion ? 'Guardar Cambios' : 'Crear Equipo' }}
        }
      </button>
    </div>

  </div>
</div>
