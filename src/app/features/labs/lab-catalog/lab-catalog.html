<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 bg-slate-50 min-h-screen">
  
  <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
    <div>
      <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Catálogo de Laboratorios</h2>
      <p class="text-slate-500 mt-2">Encuentra y reserva tu espacio de trabajo ideal.</p>
    </div>

    <div class="flex bg-white p-1 rounded-xl shadow-sm border border-slate-200">
      <button 
        (click)="setFiltro('Todos')"
        [class]="filtroActual === 'Todos' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-50'"
        class="px-6 py-2 rounded-lg font-semibold text-sm transition-all duration-200">
        Todos
      </button>
      <button 
        (click)="setFiltro('FCC')"
        [class]="filtroActual === 'FCC' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-50'"
        class="px-6 py-2 rounded-lg font-semibold text-sm transition-all duration-200">
        FCC
      </button>
      <button 
        (click)="setFiltro('FIQ')"
        [class]="filtroActual === 'FIQ' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-50'"
        class="px-6 py-2 rounded-lg font-semibold text-sm transition-all duration-200">
        FIQ
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    
    <div *ngFor="let lab of laboratoriosFiltrados" 
         class="bg-white rounded-3xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] border border-slate-50 hover:shadow-xl transition-all duration-300 overflow-hidden flex flex-col group">
      
      <div class="relative h-56 overflow-hidden">
        <img [src]="lab.imagen" [alt]="lab.nombre" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
        <div class="absolute top-4 right-4 bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full shadow-sm text-xs font-bold text-blue-600">
          {{lab.facultad}}
        </div>
      </div>

      <div class="p-8 flex-1 flex flex-col">
        <h3 class="text-xl font-bold text-slate-900 mb-3 line-clamp-2">{{lab.nombre}}</h3>
        
        <div class="space-y-2 mb-6 text-sm text-slate-500">
          <p class="flex items-center gap-2">
            <span>📍</span> {{lab.ubicacion}}
          </p>
          <p class="flex items-center gap-2 font-medium">
            <span>👥</span> Capacidad: {{lab.capacidad}} personas
          </p>
        </div>

        <div class="mt-auto pt-4 border-t border-slate-100">
          <button class="w-full py-3.5 bg-blue-50 text-blue-600 font-bold rounded-xl hover:bg-blue-600 hover:text-white transition-colors flex justify-center items-center gap-2">
            Ver Disponibilidad
            <span>&rarr;</span>
          </button>
        </div>
      </div>
      
    </div>
  </div>
</div>
