<div class="modal-overlay">

  <div class="modal-card">

    <div class="modal-header">
      <h3>Editar Perfil</h3>
      <button (click)="alCerrar.emit()" class="btn-close">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <div class="modal-body">

      <div class="form-group">
        <label>Teléfono Móvil</label>
        <input
          type="text"
          [(ngModel)]="nuevoTelefono"
          placeholder="Ej. 2221234567 (Déjalo vacío para no cambiar)"
          class="form-input"
        >
      </div>

      <div class="form-group">
        <label>Equipo Personal Registrado</label>
        <input
          type="text"
          [(ngModel)]="nuevoEquipo"
          placeholder="Ej. Laptop ASUS Strix G16 (Déjalo vacío para no cambiar)"
          class="form-input"
        >
      </div>

      <div class="form-group">
        <label>Intereses / Habilidades</label>
        <input
          type="text"
          [(ngModel)]="nuevasHabilidades"
          placeholder="Ej. Angular, Python, Docker (Separa por comas)"
          class="form-input"
        >
      </div>

      <p class="info-note">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="info-icon"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        <span>Nota: Solo llena los campos que deseas actualizar. Los campos vacíos mantendrán tu información actual.</span>
      </p>

    </div>

    <div class="modal-footer">
      <button (click)="alCerrar.emit()" class="btn-cancel">
        Cancelar
      </button>
      <button (click)="guardarCambios()" class="btn-save">
        Guardar Cambios
      </button>
    </div>

  </div>
</div>
