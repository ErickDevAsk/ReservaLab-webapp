<div class="flex flex-col lg:flex-row min-h-screen bg-slate-50">
  
  <aside [class.hidden]="!isMobileMenuOpen()" 
         class="lg:block lg:w-64 bg-white border-r border-slate-200 min-h-screen fixed lg:static z-50 w-full transition-all">
    <div class="p-6">
      <div class="flex items-center gap-2 text-blue-600 font-bold text-xl mb-8">
        <i class="fas fa-flask"></i> ReservaLab
      </div>
      
      <nav class="space-y-2">
        <a href="#" class="flex items-center gap-3 px-4 py-3 bg-blue-600 text-white rounded-xl shadow-sm">
          <i class="fas fa-th-large"></i> Dashboard
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-100 rounded-xl transition-colors">
          <i class="fas fa-calendar-alt"></i> Reservas
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-100 rounded-xl transition-colors">
          <i class="fas fa-box"></i> Préstamos
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-100 rounded-xl transition-colors">
          <i class="fas fa-user"></i> Mi Perfil
        </a>
      </nav>
    </div>
  </aside>

  <main class="flex-1 p-4 lg:p-10">
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-10">
      <div>
        <h1 class="text-3xl font-bold text-slate-900 leading-tight">Mi Dashboard</h1>
        <p class="text-slate-500 font-medium">Gestiona tus reservas y préstamos de equipos</p>
      </div>
      <button class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-xl shadow-lg shadow-blue-200 flex items-center justify-center gap-2 transition-all active:scale-95">
        <span class="text-xl font-bold">+</span> Nueva Reserva
      </button>
    </header>

    <div id="dashboard-content">
       </div>
  </main>
</div>
