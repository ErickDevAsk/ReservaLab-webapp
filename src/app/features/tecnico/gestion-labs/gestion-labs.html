<div class="space-y-6">

  <!-- HEADER -->
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-3xl font-bold">Gestión de Laboratorios</h1>
      <p class="text-gray-500">5 laboratorios registrados</p>
    </div>

    <button class="bg-blue-600 text-white px-5 py-2 rounded-lg shadow hover:bg-blue-700">
      + Nuevo Laboratorio
    </button>
  </div>

  <!-- FILTROS -->
  <div class="bg-white p-4 rounded-xl shadow grid grid-cols-3 gap-4">

    <input
      type="text"
      placeholder="Buscar por nombre o edificio..."
      class="border p-2 rounded-lg"
    />

    <select class="border p-2 rounded-lg">
      <option>Todos los Edificios</option>
    </select>

    <select class="border p-2 rounded-lg">
      <option>Todos los Estados</option>
    </select>

  </div>

  <!-- TABLA -->
  <div class="bg-white rounded-xl shadow overflow-hidden">

    <table class="w-full text-sm">

      <thead class="bg-gray-50 text-gray-500">
        <tr>
          <th class="text-left p-4">LABORATORIO</th>
          <th class="text-left p-4">UBICACIÓN</th>
          <th class="text-left p-4">CAPACIDAD</th>
          <th class="text-left p-4">EQUIPOS</th>
          <th class="text-left p-4">ESTADO</th>
          <th class="text-left p-4">ACCIONES</th>
        </tr>
      </thead>

      <tbody>

        <!-- ROW -->
        <tr class="border-t hover:bg-gray-50">
          <td class="p-4 flex items-center gap-3">
            <img src="https://via.placeholder.com/40" class="rounded-lg">
            <span>Laboratorio de Física</span>
          </td>

          <td class="p-4">
            Edificio A <br>
            <span class="text-gray-400 text-xs">Piso 3</span>
          </td>

          <td class="p-4">25 est.</td>
          <td class="p-4">12 unidades</td>

          <td class="p-4">
            <span class="bg-green-100 text-green-600 px-2 py-1 rounded">
              Abierto
            </span>
          </td>

          <td class="p-4 space-x-3 text-gray-500">
            👁️ ✏️ 🗑️
          </td>
        </tr>

        <!-- ROW -->
        <tr class="border-t hover:bg-gray-50">
          <td class="p-4 flex items-center gap-3">
            <img src="https://via.placeholder.com/40" class="rounded-lg">
            <span>Laboratorio de Computación</span>
          </td>

          <td class="p-4">Edificio C</td>
          <td class="p-4">30 est.</td>
          <td class="p-4">30 unidades</td>

          <td class="p-4">
            <span class="bg-red-100 text-red-600 px-2 py-1 rounded">
              Cerrado
            </span>
          </td>

          <td class="p-4 space-x-3">👁️ ✏️ 🗑️</td>
        </tr>

      </tbody>

    </table>

  </div>

</div>
